<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jednoduchá hra</title>

<style>
body {
    margin: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#gameCanvas {
    background: black;
    border: 2px solid white;
    touch-action: none;
}

#score {
    position: absolute;
    top: 10px;
    left: 10px;
    color: white;
    font-size: 22px;
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>
<div id="score">Skóre: 0</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreDiv = document.getElementById("score");

let animationId;
let paused = false;
let gameOver = false;

// ===== HRÁČ =====
const player = {
    x: 60,
    y: 0,
    size: 40,
    speed: 9,
    color: "lime"
};

// ===== HRA =====
let obstacles = [];
let score = 0;
let keys = {};

let baseSpeed = 5;
let obstacleSpeed = baseSpeed;

// 🔥 VELKÁ MEZERA NA VÝŠKU
let minGap = player.size * 4.2; // ← HODNĚ VELKÁ DÍRA

let lastGapY = null;

// ===== MOBIL =====
function isMobile() {
    return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

// ===== CANVAS =====
function resizeCanvas() {
    canvas.width = window.innerWidth * 0.95;
    canvas.height = window.innerHeight * 0.85;
    if (player.y === 0) {
        player.y = canvas.height / 2 - player.size / 2;
    }
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

// ===== OVLÁDÁNÍ =====
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const y = e.touches[0].clientY - rect.top;
    player.y = y - player.size / 2;
    player.y = Math.max(0, Math.min(player.y, canvas.height - player.size));
}, { passive: false });

// ===== ORIENTACE =====
function checkOrientation() {
    if (isMobile() && innerWidth > innerHeight) {
        pauseGame();
        canvas.style.display = "none";
        scoreDiv.style.display = "none";

        if (!document.getElementById("rotate")) {
            const d = document.createElement("div");
            d.id = "rotate";
            d.textContent = "Otoč telefon na výšku 📱";
            d.style.cssText = `
                position:fixed; inset:0;
                background:black; color:white;
                display:flex; align-items:center;
                justify-content:center;
                font-size:24px; z-index:10;
            `;
            document.body.appendChild(d);
        }
    } else {
        resumeGame();
        canvas.style.display = "block";
        scoreDiv.style.display = "block";
        const r = document.getElementById("rotate");
        if (r) r.remove();
    }
}
window.addEventListener("resize", checkOrientation);
window.addEventListener("orientationchange", checkOrientation);

// ===== PAUSE =====
function pauseGame() {
    if (!paused) {
        paused = true;
        cancelAnimationFrame(animationId);
    }
}

function resumeGame() {
    if (paused && !gameOver) {
        paused = false;
        update();
    }
}

// ===== PŘEKÁŽKY =====
function createObstacle() {
    const gapHeight = minGap;

    let gapY;
    if (lastGapY === null) {
        gapY = Math.random() * (canvas.height - gapHeight - 100) + 50;
    } else {
        const maxShift = 100;
        gapY = lastGapY + (Math.random() * maxShift * 2 - maxShift);
        gapY = Math.max(40, Math.min(gapY, canvas.height - gapHeight - 40));
    }

    lastGapY = gapY;

    obstacles.push({
        x: canvas.width,
        width: 22,
        top: gapY,
        bottom: canvas.height - gapY - gapHeight,
        passed: false
    });
}

// ===== HERNÍ SMYČKA =====
function update() {
    if (paused || gameOver) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // pohyb hráče
    if (keys["ArrowUp"]) player.y -= player.speed;
    if (keys["ArrowDown"]) player.y += player.speed;
    player.y = Math.max(0, Math.min(player.y, canvas.height - player.size));

    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.size, player.size);

    for (let i = 0; i < obstacles.length; i++) {
        const o = obstacles[i];
        o.x -= obstacleSpeed;

        ctx.fillStyle = "red";
        ctx.fillRect(o.x, 0, o.width, o.top);
        ctx.fillRect(o.x, canvas.height - o.bottom, o.width, o.bottom);

        // kolize
        if (
            player.x < o.x + o.width &&
            player.x + player.size > o.x &&
            (player.y < o.top || player.y + player.size > canvas.height - o.bottom)
        ) {
            endGame();
            return;
        }

        // skóre
        if (!o.passed && o.x + o.width < player.x) {
            o.passed = true;
            score++;
            scoreDiv.textContent = "Skóre: " + score;

            // 🔥 ZRYCHLENÍ KAŽDÝCH 5 BODŮ
            obstacleSpeed = baseSpeed + Math.floor(score / 5);
        }

        if (o.x + o.width < 0) {
            obstacles.splice(i, 1);
            i--;
        }
    }

    // 🔥 PŘEKÁŽKY BLÍŽ U SEBE
    if (Math.random() < 0.12) createObstacle();

    animationId = requestAnimationFrame(update);
}

// ===== GAME OVER =====
function endGame() {
    gameOver = true;
    cancelAnimationFrame(animationId);
    setTimeout(() => {
        alert("Konec hry! Skóre: " + score);
        reset();
    }, 100);
}

function reset() {
    obstacles = [];
    score = 0;
    obstacleSpeed = baseSpeed;
    lastGapY = null;
    gameOver = false;
    paused = false;
    scoreDiv.textContent = "Skóre: 0";
    player.y = canvas.height / 2 - player.size / 2;
    update();
}

// ===== START =====
checkOrientation();
update();
</script>

</body>
</html>
