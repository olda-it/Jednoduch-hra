<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jednoduchá hra</title>

<style>
body {
    margin: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#gameCanvas {
    background: black;
    border: 2px solid white;
    touch-action: none;
}

#scoreBox {
    position: absolute;
    top: 10px;
    left: 10px;
    color: white;
    font-size: 20px;
    line-height: 1.4;
    z-index: 5;
}

#rotateWarning {
    position: fixed;
    inset: 0;
    background: black;
    color: white;
    display: none;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-size: 24px;
    z-index: 10;
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<div id="scoreBox">
    Skóre: <span id="score">0</span><br>
    Best: <span id="bestScore">0</span>
</div>

<div id="rotateWarning">Otoč telefon na výšku 📱</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const bestScoreEl = document.getElementById("bestScore");
const rotateWarning = document.getElementById("rotateWarning");

let animationId;
let paused = false;
let gameOver = false;

// ===== BEST SCORE =====
let bestScore = Number(localStorage.getItem("bestScore")) || 0;
bestScoreEl.textContent = bestScore;

// ===== HRÁČ =====
const player = {
    x: 60,
    y: 0,
    size: 40,
    speed: 9,
    color: "lime"
};

// ===== HRA =====
let obstacles = [];
let score = 0;
let keys = {};

const baseSpeed = 5;
let obstacleSpeed = baseSpeed;

const gapHeight = player.size * 4.2;

const MIN_DISTANCE = 200;
const MAX_DISTANCE = 280;
const OBSTACLE_WIDTH = 22;

let lastGapY = null;

// ===== CANVAS =====
function resizeCanvas() {
    canvas.width = window.innerWidth * 0.95;
    canvas.height = window.innerHeight * 0.85;
    if (!player.y) {
        player.y = canvas.height / 2 - player.size / 2;
    }
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

// ===== DETEKCE MOBILU =====
function isMobile() {
    return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

// ===== ORIENTACE =====
function checkOrientation() {
    if (isMobile() && window.innerWidth > window.innerHeight) {
        paused = true;
        cancelAnimationFrame(animationId);
        rotateWarning.style.display = "flex";
    } else {
        rotateWarning.style.display = "none";
        if (paused && !gameOver) {
            paused = false;
            update();
        }
    }
}
window.addEventListener("resize", checkOrientation);
window.addEventListener("orientationchange", checkOrientation);

// ===== OVLÁDÁNÍ =====
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const y = e.touches[0].clientY - rect.top;
    player.y = y - player.size / 2;
    player.y = Math.max(0, Math.min(player.y, canvas.height - player.size));
}, { passive: false });

// ===== PŘEKÁŽKY =====
function createObstacle() {
    let gapY;
    if (lastGapY === null) {
        gapY = Math.random() * (canvas.height - gapHeight - 100) + 50;
    } else {
        const shift = 100;
        gapY = lastGapY + (Math.random() * shift * 2 - shift);
        gapY = Math.max(40, Math.min(gapY, canvas.height - gapHeight - 40));
    }
    lastGapY = gapY;

    obstacles.push({
        x: canvas.width,
        width: OBSTACLE_WIDTH,
        top: gapY,
        bottom: canvas.height - gapY - gapHeight,
        passed: false,
        nextDistance:
            Math.random() * (MAX_DISTANCE - MIN_DISTANCE) + MIN_DISTANCE
    });
}

// ===== HERNÍ SMYČKA =====
function update() {
    if (paused || gameOver) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (keys["ArrowUp"]) player.y -= player.speed;
    if (keys["ArrowDown"]) player.y += player.speed;
    player.y = Math.max(0, Math.min(player.y, canvas.height - player.size));

    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.size, player.size);

    if (
        obstacles.length === 0 ||
        canvas.width - (obstacles[obstacles.length - 1].x + OBSTACLE_WIDTH)
        >= obstacles[obstacles.length - 1].nextDistance
    ) {
        createObstacle();
    }

    for (let i = 0; i < obstacles.length; i++) {
        const o = obstacles[i];
        o.x -= obstacleSpeed;

        ctx.fillStyle = "red";
        ctx.fillRect(o.x, 0, o.width, o.top);
        ctx.fillRect(o.x, canvas.height - o.bottom, o.width, o.bottom);

        if (
            player.x < o.x + o.width &&
            player.x + player.size > o.x &&
            (player.y < o.top ||
             player.y + player.size > canvas.height - o.bottom)
        ) {
            endGame();
            return;
        }

        if (!o.passed && o.x + o.width < player.x) {
            o.passed = true;
            score++;
            scoreEl.textContent = score;

            obstacleSpeed = baseSpeed + Math.floor(score / 5);

            if (score > bestScore) {
                bestScore = score;
                bestScoreEl.textContent = bestScore;
                localStorage.setItem("bestScore", bestScore);
            }
        }

        if (o.x + o.width < 0) {
            obstacles.splice(i, 1);
            i--;
        }
    }

    animationId = requestAnimationFrame(update);
}

// ===== GAME OVER =====
function endGame() {
    gameOver = true;
    cancelAnimationFrame(animationId);
    setTimeout(() => {
        alert("Konec hry! Skóre: " + score);
        reset();
    }, 100);
}

function reset() {
    obstacles = [];
    score = 0;
    obstacleSpeed = baseSpeed;
    lastGapY = null;
    gameOver = false;
    scoreEl.textContent = 0;
    player.y = canvas.height / 2 - player.size / 2;
    update();
}

// ===== START =====
checkOrientation();
update();
</script>

</body>
</html>
