<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jednoduchá Hra</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #282c34;
        }

        #gameCanvas {
            border: 2px solid #fff;
            background-color: #000;
        }
    </style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="600"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let player = { x:50, y:canvas.height/2-20, width:40, height:40, speed:10, color:'green' };
let obstacles = [];
let obstacleSpeed = 6;
let score = 0;
let minGap = player.height + 80;
let maxGap = 350;
let lastObstaclePosition = { top:0, bottom:canvas.height };
let minDistance = 150;
let gameOver = false;

let keys = {};

window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

function createObstacle(){
    const topHeight = Math.random()*(canvas.height - maxGap - 20)+20;
    const gap = Math.random()*(maxGap - minGap)+minGap;
    const bottomHeight = canvas.height - topHeight - gap;

    if(Math.abs(lastObstaclePosition.top - topHeight)<minDistance || Math.abs(lastObstaclePosition.bottom - bottomHeight)<minDistance) return;

    lastObstaclePosition.top = topHeight;
    lastObstaclePosition.bottom = bottomHeight;

    obstacles.push({ x:canvas.width, topHeight, bottomHeight, width:20, passed:false });
}

function updateGameArea(){
    if(gameOver) return;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Pohyb hráče šipkami
    if(keys['ArrowUp'] && player.y>0) player.y -= player.speed;
    if(keys['ArrowDown'] && player.y<canvas.height-player.height) player.y += player.speed;

    // Kreslení hráče
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // Překážky
    for(let i=0;i<obstacles.length;i++){
        const obs = obstacles[i];
        obs.x -= obstacleSpeed;

        ctx.fillStyle='red';
        ctx.fillRect(obs.x, 0, obs.width, obs.topHeight);
        ctx.fillRect(obs.x, canvas.height - obs.bottomHeight, obs.width, obs.bottomHeight);

        if(player.x < obs.x + obs.width && player.x + player.width > obs.x &&
           (player.y < obs.topHeight || player.y + player.height > canvas.height - obs.bottomHeight)){
            endGame(); return;
        }

        if(!obs.passed && obs.x + obs.width < player.x){ obs.passed = true; score++; }

        if(obs.x + obs.width < 0){ obstacles.splice(i,1); i--; }
    }

    if(Math.random() < 0.1) createObstacle();

    if(score % 5 === 0 && score !== 0) obstacleSpeed = 6 + score / 10;

    ctx.fillStyle = '#fff';
    ctx.font = '20px Arial';
    ctx.fillText(`Skóre: ${score}`, 10, 30);

    requestAnimationFrame(updateGameArea);
}

function endGame(){
    gameOver = true;
    setTimeout(()=>{ alert(`Konec hry! Skóre: ${score}`); resetGame(); },100);
}

function resetGame(){
    player.y = canvas.height/2-20;
    obstacles = [];
    obstacleSpeed = 6;
    score = 0;
    gameOver = false;
    keys = {};
    updateGameArea();
}

updateGameArea();
</script>
</body>
</html>
