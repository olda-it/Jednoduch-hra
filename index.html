<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jednoduchá Hra</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #282c34;
            font-family: Arial, sans-serif;
        }

        #gameCanvas {
            border: 2px solid #fff;
            background-color: #000;
        }

        #controls {
            margin-top: 10px;
            text-align: center;
        }

        #controls button {
            font-size: 2em;
            padding: 10px 20px;
            margin: 0 10px;
            border: none;
            border-radius: 10px;
            background-color: #4CAF50;
            color: white;
        }

        #controls button:active {
            background-color: #2e7d32;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="controls">
        <button id="upBtn">⬆️</button>
        <button id="downBtn">⬇️</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Responzivní canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth * 0.95;
            canvas.height = window.innerHeight * 0.7;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let player = {
            x: 50,
            y: canvas.height / 2 - 20,
            width: 30,
            height: 30,
            speed: 8,
            color: 'green'
        };

        let obstacles = [];
        let obstacleSpeed = 5;
        let score = 0;

        let minGap = player.height + 80;
        let maxGap = 180;
        let minDistance = 180;

        let gameOver = false;
        let keys = {};

        // Ovládání šipkami
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        // Dotyková tlačítka
        document.getElementById('upBtn').addEventListener('touchstart', () => keys['ArrowUp'] = true);
        document.getElementById('upBtn').addEventListener('touchend', () => keys['ArrowUp'] = false);

        document.getElementById('downBtn').addEventListener('touchstart', () => keys['ArrowDown'] = true);
        document.getElementById('downBtn').addEventListener('touchend', () => keys['ArrowDown'] = false);

        function createObstacle() {
            const gap = Math.random() * (maxGap - minGap) + minGap;
            const topHeight = Math.random() * (canvas.height - gap - 40) + 20;
            const bottomHeight = canvas.height - topHeight - gap;

            if (obstacles.length > 0) {
                const last = obstacles[obstacles.length - 1];
                if (canvas.width - last.x < minDistance) return;
            }

            obstacles.push({
                x: canvas.width,
                topHeight: topHeight,
                bottomHeight: bottomHeight,
                width: 20,
                passed: false
            });
        }

        function updateGameArea() {
            if (gameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Pohyb hráče
            if (keys['ArrowUp'] && player.y > 0) player.y -= player.speed;
            if (keys['ArrowDown'] && player.y < canvas.height - player.height) player.y += player.speed;

            // Kreslení hráče
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Pohyb a kreslení překážek
            for (let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];
                obs.x -= obstacleSpeed;

                ctx.fillStyle = 'red';
                ctx.fillRect(obs.x, 0, obs.width, obs.topHeight);
                ctx.fillRect(obs.x, canvas.height - obs.bottomHeight, obs.width, obs.bottomHeight);

                // Kolize
                if (
                    player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    (player.y < obs.topHeight || player.y + player.height > canvas.height - obs.bottomHeight)
                ) {
                    endGame();
                    return;
                }

                // Skóre
                if (!obs.passed && obs.x + obs.width < player.x) {
                    obs.passed = true;
                    score++;
                }

                // Odstranění mimo obrazovku
                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                    i--;
                }
            }

            // Generování překážek
            if (Math.random() < 0.08) createObstacle();

            // Zvyšování rychlosti podle skóre
            obstacleSpeed = 5 + score / 5;

            // Zobrazení skóre
            ctx.fillStyle = '#fff';
            ctx.font = '20px Arial';
            ctx.fillText(`Skóre: ${score}`, 10, 30);

            requestAnimationFrame(updateGameArea);
        }

        function endGame() {
            gameOver = true;
            setTimeout(() => {
                alert(`Konec hry! Skóre: ${score}`);
                resetGame();
            }, 100);
        }

        function resetGame() {
            player.y = canvas.height / 2 - 20;
            obstacles = [];
            obstacleSpeed = 5;
            score = 0;
            gameOver = false;
            keys = {};
            updateGameArea();
        }

        updateGameArea();
    </script>
</body>
</html>
