<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jednoduchá Hra</title>
<style>
body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #282c34;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#gameCanvas {
    border: 2px solid #fff;
    background-color: #000;
    touch-action: none;
}

#scoreDisplay {
    position: absolute;
    top: 10px;
    left: 10px;
    color: #fff;
    font-size: 20px;
}

/* Landscape pouze na mobilu (max-width: 768px) */
@media only screen and (max-width: 768px) and (orientation: landscape) {
    body::after {
        content: "Prosím, otočte telefon na výšku (portrait).";
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #000;
        color: #fff;
        font-size: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        text-align: center;
        padding: 20px;
    }
    #gameCanvas { display: none; }
}
</style>
</head>
<body tabindex="0">
<canvas id="gameCanvas"></canvas>
<div id="scoreDisplay">Skóre: 0</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('scoreDisplay');

let player = { x:50, y:0, width:40, height:40, speed:10, color:'green' };
let obstacles = [];
let obstacleSpeed = 6;
let score = 0;
let minGap = player.height * 1.5; // minimální mezera
let maxGap = 250;
let minDistance = 200; // vzdálenost mezi překážkami
let gameOver = false;
let keys = {};

// Responzivní canvas
function resizeCanvas(){
    if(window.innerHeight > window.innerWidth || window.innerWidth > 768){
        canvas.width = window.innerWidth * 0.95;
        canvas.height = window.innerHeight * 0.8;
        if(player.y === 0) player.y = canvas.height/2 - player.height/2;
    } else {
        canvas.width = 0;
        canvas.height = 0;
    }
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// PC ovládání šipkami
document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

// Mobil – dotyk
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const y = touch.clientY - rect.top;
    player.y = y - player.height/2;
    if(player.y < 0) player.y = 0;
    if(player.y + player.height > canvas.height) player.y = canvas.height - player.height;
}, {passive:false});

// Vytvoření překážky
function createObstacle(){
    const gap = Math.random() * (maxGap - minGap) + minGap;
    const topHeight = Math.random() * (canvas.height - gap - 40) + 20;
    const bottomHeight = canvas.height - topHeight - gap;

    if(obstacles.length > 0){
        const last = obstacles[obstacles.length - 1];
        if(canvas.width - last.x < minDistance) return;
    }

    obstacles.push({
        x: canvas.width,
        topHeight,
        bottomHeight,
        width: 20,
        passed: false
    });
}

// Hlavní smyčka
function updateGameArea(){
    if(gameOver) return;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Pohyb hráče šipkami (PC)
    if(keys['ArrowUp'] && player.y > 0) player.y -= player.speed;
    if(keys['ArrowDown'] && player.y < canvas.height - player.height) player.y += player.speed;

    // Kreslení hráče
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // Překážky
    for(let i=0;i<obstacles.length;i++){
        const obs = obstacles[i];
        obs.x -= obstacleSpeed;

        ctx.fillStyle = 'red';
        ctx.fillRect(obs.x, 0, obs.width, obs.topHeight);
        ctx.fillRect(obs.x, canvas.height - obs.bottomHeight, obs.width, obs.bottomHeight);

        if(player.x < obs.x + obs.width && player.x + player.width > obs.x &&
           (player.y < obs.topHeight || player.y + player.height > canvas.height - obs.bottomHeight)){
            endGame(); return;
        }

        if(!obs.passed && obs.x + obs.width < player.x){
            obs.passed = true;
            score++;
            scoreDisplay.textContent = `Skóre: ${score}`;
        }

        if(obs.x + obs.width < 0){
            obstacles.splice(i,1);
            i--;
        }
    }

    if(Math.random() < 0.1) createObstacle();

    if(score % 5 === 0 && score !== 0) obstacleSpeed = 6 + score/10;

    ctx.fillStyle = '#fff';
    ctx.font = '20px Arial';
    ctx.fillText(`Skóre: ${score}`, 10, 30);

    requestAnimationFrame(updateGameArea);
}

function endGame(){
    gameOver = true;
    setTimeout(()=>{ alert(`Konec hry! Skóre: ${score}`); resetGame(); }, 100);
}

function resetGame(){
    player.y = canvas.height/2 - player.height/2;
    obstacles = [];
    obstacleSpeed = 6;
    score = 0;
    gameOver = false;
    keys = {};
    updateGameArea();
}

// Spuštění hry
updateGameArea();
</script>
</body>
</html>
