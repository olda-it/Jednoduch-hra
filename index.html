<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jednoduchá hra</title>

<style>
body {
    margin: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#gameCanvas {
    background: black;
    border: 2px solid white;
    touch-action: none;
}

#score {
    position: absolute;
    top: 10px;
    left: 10px;
    color: white;
    font-size: 22px;
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>
<div id="score">Skóre: 0</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreDiv = document.getElementById("score");

let animationId;
let paused = false;
let gameOver = false;

// ===== HRÁČ =====
const player = {
    x: 60,
    y: 0,
    size: 40,
    speed: 9,
    color: "lime"
};

// ===== HRA =====
let obstacles = [];
let score = 0;
let keys = {};

const baseSpeed = 5;
let obstacleSpeed = baseSpeed;

// ✅ VELKÁ MEZERA NA VÝŠKU
const gapHeight = player.size * 4.2;

// ✅ ROZESTUPY NA ŠÍŘKU – GARANTOVANÉ
const MIN_DISTANCE = 200;
const MAX_DISTANCE = 280;
const OBSTACLE_WIDTH = 22;

let lastGapY = null;

// ===== CANVAS =====
function resizeCanvas() {
    canvas.width = window.innerWidth * 0.95;
    canvas.height = window.innerHeight * 0.85;
    if (!player.y) {
        player.y = canvas.height / 2 - player.size / 2;
    }
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

// ===== OVLÁDÁNÍ =====
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const y = e.touches[0].clientY - rect.top;
    player.y = y - player.size / 2;
    player.y = Math.max(0, Math.min(player.y, canvas.height - player.size));
}, { passive: false });

// ===== PŘEKÁŽKA =====
function createObstacle() {
    let gapY;
    if (lastGapY === null) {
        gapY = Math.random() * (canvas.height - gapHeight - 100) + 50;
    } else {
        const shift = 100;
        gapY = lastGapY + (Math.random() * shift * 2 - shift);
        gapY = Math.max(40, Math.min(gapY, canvas.height - gapHeight - 40));
    }
    lastGapY = gapY;

    obstacles.push({
        x: canvas.width,
        width: OBSTACLE_WIDTH,
        top: gapY,
        bottom: canvas.height - gapY - gapHeight,
        passed: false,
        nextDistance: Math.random() * (MAX_DISTANCE - MIN_DISTANCE) + MIN_DISTANCE
    });
}

// ===== HERNÍ SMYČKA =====
function update() {
    if (paused || gameOver) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // pohyb hráče
    if (keys["ArrowUp"]) player.y -= player.speed;
    if (keys["ArrowDown"]) player.y += player.speed;
    player.y = Math.max(0, Math.min(player.y, canvas.height - player.size));

    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.size, player.size);

    // ===== GENEROVÁNÍ – PODLE POSLEDNÍ PŘEKÁŽKY =====
    if (
        obstacles.length === 0 ||
        canvas.width - (obstacles[obstacles.length - 1].x + OBSTACLE_WIDTH)
        >= obstacles[obstacles.length - 1].nextDistance
    ) {
        createObstacle();
    }

    for (let i = 0; i < obstacles.length; i++) {
        const o = obstacles[i];
        o.x -= obstacleSpeed;

        ctx.fillStyle = "red";
        ctx.fillRect(o.x, 0, o.width, o.top);
        ctx.fillRect(o.x, canvas.height - o.bottom, o.width, o.bottom);

        // kolize
        if (
            player.x < o.x + o.width &&
            player.x + player.size > o.x &&
            (player.y < o.top || player.y + player.size > canvas.height - o.bottom)
        ) {
            endGame();
            return;
        }

        // skóre + zrychlení
        if (!o.passed && o.x + o.width < player.x) {
            o.passed = true;
            score++;
            scoreDiv.textContent = "Skóre: " + score;
            obstacleSpeed = baseSpeed + Math.floor(score / 5);
        }

        if (o.x + o.width < 0) {
            obstacles.splice(i, 1);
            i--;
        }
    }

    animationId = requestAnimationFrame(update);
}

// ===== GAME OVER =====
function endGame() {
    gameOver = true;
    cancelAnimationFrame(animationId);
    setTimeout(() => {
        alert("Konec hry! Skóre: " + score);
        reset();
    }, 100);
}

function reset() {
    obstacles = [];
    score = 0;
    obstacleSpeed = baseSpeed;
    lastGapY = null;
    gameOver = false;
    scoreDiv.textContent = "Skóre: 0";
    player.y = canvas.height / 2 - player.size / 2;
    update();
}

// ===== START =====
update();
</script>

</body>
</html>
